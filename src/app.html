<!doctype html>
<html lang="en">
	<head>
		<title>Alek Ortiz | Portfolio</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Alek Ortiz portfolio website" />
		<meta name="robots" content="index, follow" />
		<meta name="author" content="Alek Ortiz" />

		<meta http-equiv="X-Content-Type-Options" content="nosniff" />
		<meta http-equiv="X-XSS-Protection" content="1; mode=block" />

		<link rel="icon" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/favicon.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500&display=swap"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link
				rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500&display=swap"
			/>
		</noscript>

		<script>
			(() => {
				const storageKey = 'theme';
				const root = document.documentElement;

				try {
					const saved = localStorage.getItem(storageKey);
					const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					const theme =
						saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light';

					root.classList.remove('dark', 'light');
					root.classList.add(theme);
					root.setAttribute('data-theme', theme);
				} catch {
					root.classList.add('dark');
					root.setAttribute('data-theme', 'dark');
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body class="font-body" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
